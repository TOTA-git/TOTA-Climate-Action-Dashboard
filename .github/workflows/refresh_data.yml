
name: Scheduled Data Refresh

on:
  schedule:
    - cron: '47 17 * * *'
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install system libraries needed by R spatial packages
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      # Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install R package dependencies
      - name: Install R Package Dependencies
        run: |
          Rscript -e 'install.packages(c("httr", "jsonlite", "readr", "dplyr", "tidyr", "lubridate", "sf", "geojsonsf", "rvest", "httr2", "stringr", "readxl", "purrr", "lutz"))'
          Rscript -e 'install.packages("weathercan", repos = c("https://ropensci.r-universe.dev", "https://cloud.r-project.org"))'

      # Run data refresh script
      - name: Run data refresh script
        env:
          GOOGLE_SHEET_DROUGHT_URL: ${{ secrets.GOOGLE_SHEET_DROUGHT_URL }}
        run: |
          Rscript -e 'source("data_refresh.R")'

      # Commit and push updated cached datasets
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/
          git diff-index --quiet HEAD || git commit -m "Automated data refresh: $(date +'%Y-%m-%d')"
          git push
