
name: Deploy Climate Dashboard to tota2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"

      - name: Install rsconnect
        run: |
          Rscript -e "install.packages('rsconnect', repos = 'https://cloud.r-project.org')"

      - name: Authenticate and deploy to tota2
        env:
          RSCONNECT_CLIENT_ID: ${{ secrets.RSCONNECT_CLIENT_ID }}
          RSCONNECT_CLIENT_SECRET: ${{ secrets.RSCONNECT_CLIENT_SECRET }}
        run: |
          Rscript -e '
            rsconnect::connectCloudClientCredentials(
              clientId = Sys.getenv("RSCONNECT_CLIENT_ID"),
              clientSecret = Sys.getenv("RSCONNECT_CLIENT_SECRET"),
              accountName = "tota2"
            )

            rsconnect::deployApp(
              appDir = ".",
              appId = "01a1c18c-a1cd-75b0-a911-df5c1d2e1dcd",
              account = "tota2",
              forceUpdate = TRUE,
              logLevel = "verbose"
            )
          '
