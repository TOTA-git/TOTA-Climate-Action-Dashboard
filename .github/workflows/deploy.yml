
name: Deploy Climate Dashboard to tota2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      # Installs all R packages needed
      - name: Install R Package Dependencies
        run: |
          Rscript -e 'install.packages(c("remotes","bcmaps","bslib", "dplyr", "fresh", "geojsonsf", "ggplot2", "httr", "leaflet", "lubridate", "lutz","plotly", "purrr", "readr", "readxl", "rvest", "scales", "sf", "shiny", "shinydashboard", "stringr", "tidyr"))'
          Rscript -e 'remotes::install_github("ropensci/weathercan@7869a45c4ca551c1160bed16d312e4361bd0e2d4")'

      - name: Install rsconnect
        run: |
          Rscript -e '
            install.packages(
              "rsconnect",
              lib = Sys.getenv("R_LIBS_USER"),
              repos = c(CRAN = Sys.getenv("RSPM"))
            )

            packageVersion("rsconnect")
          '

      - name: Authenticate and deploy to tota2
        env:
          RSCONNECT_CLIENT_ID: ${{ secrets.RSCONNECT_CLIENT_ID }}
          RSCONNECT_CLIENT_SECRET: ${{ secrets.RSCONNECT_CLIENT_SECRET }}
        run: |
          Rscript -e '
            .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))

            library(rsconnect)
            rsconnect::connectCloudClientCredentials(
              clientId = Sys.getenv("RSCONNECT_CLIENT_ID"),
              clientSecret = Sys.getenv("RSCONNECT_CLIENT_SECRET"),
              accountName = "tota2"
            )

            rsconnect::deployApp(
              appDir = ".",
              appId = "01a1c18c-a1cd-75b0-a911-df5c1d2e1dcd",
              account = "tota2",
              forceUpdate = TRUE,
              logLevel = "verbose"
            )
          '
